[tools]
node = "24.21.0"
pnpm = "12.4.2"
uv = "0.12.16"

[tasks.install]
description = "Install JavaScript and Python dependencies"
run = """
pnpm install
uv sync --project apps/tracer-python
"""

[tasks.dev]
description = "Run the server and web development servers"
run = "pnpm run dev"

[tasks."dev:server"]
description = "Run only the API server (loopback :3001, restarts on change)"
run = "pnpm --filter @codewalk/server run dev"

[tasks."dev:web"]
description = "Run only the web dev server (localhost:5173); extra arguments go to Vite"
run = "pnpm --filter @codewalk/web run dev"

[tasks.format]
description = "Check formatting"
run = """
pnpm run format
uv run --project apps/tracer-python ruff format --check apps/tracer-python
"""

[tasks.lint]
description = "Lint TypeScript and Python"
run = """
pnpm run lint
uv run --project apps/tracer-python ruff check apps/tracer-python
"""

[tasks.typecheck]
description = "Type-check TypeScript and Python"
run = """
pnpm run typecheck
uv run --project apps/tracer-python ty check --project apps/tracer-python
"""

[tasks.knip]
description = "Check for unused JavaScript and TypeScript code"
run = "pnpm run knip"

[tasks.schema]
description = "Regenerate the trace JSON Schema"
run = "node packages/trace/scripts/generate-schema.ts"

[tasks."schema:check"]
description = "Check that the trace JSON Schema is current"
run = "node packages/trace/scripts/generate-schema.ts --check"

[tasks.test]
description = "Run JavaScript, TypeScript, and Python tests"
run = """
pnpm run test
uv run --project apps/tracer-python pytest apps/tracer-python
"""

[tasks.goldens]
description = "Regenerate Python tracer golden traces"
run = """
for source in spec/fixtures/*.py; do
  trace="${source%.py}.trace.jsonl"
  input="${source%.py}.stdin"
  if [ -f "$input" ]; then
    uv run --project apps/tracer-python python -m codewalk run "$source" < "$input" > "$trace"
  else
    uv run --project apps/tracer-python python -m codewalk run "$source" > "$trace"
  fi
done
"""

[tasks.check]
description = "Run every repository check"
depends = ["format", "lint", "typecheck", "knip", "test", "schema:check"]

[tasks.fix]
description = "Apply automatic formatting and lint fixes"
run = """
pnpm run fix:format
pnpm run fix:lint
uv run --project apps/tracer-python ruff format apps/tracer-python
uv run --project apps/tracer-python ruff check --fix apps/tracer-python
"""
