[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[project]
name = "codewalk"
version = "0.0.0"
description = "Python execution tracer for codewalk"
requires-python = "==3.13.*"
dependencies = []

[dependency-groups]
dev = [
  "jsonschema>=4.25.1",
  "pytest>=9.1.1",
  "ruff>=0.16.8",
  "ty>=0.0.82",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.src]
include = ["src"]
